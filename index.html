rand-row"><div class="brand-mark">TP</div><div><div class="brand-title">Textile Planning Dashboard</div><div class="brand-sub">DEPARTMENT OF BUSINESS PLANNING</div></div></div><h2>Authorized access</h2><p>Sign in to view the shared planning dashboard.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn" style="width:100%">Sign in</button><div class="error" id="loginError"></div></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const REQUIRED_SHEETS=['Dyeing','Knitting','Finishing','FFS','Buyer Wise data'];
const state={data:null,filtered:null,tab:'overview',charts:[],profile:null};
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const safeNum=v=>{if(v===null||v===undefined||v===''||String(v).startsWith('#')) return null; const n=Number(v); return Number.isFinite(n)?n:null};
const vals=(rows,key)=>rows.map(r=>safeNum(r[key])).filter(v=>v!==null);
const sum=(rows,key)=>vals(rows,key).reduce((a,b)=>a+b,0);
const avg=(rows,key)=>{const a=vals(rows,key);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
const fmt=n=>n===null||!Number.isFinite(n)?'—':Math.round(n).toLocaleString();
const fmt1=n=>n===null||!Number.isFinite(n)?'—':n.toLocaleString(undefined,{maximumFractionDigits:1});
const ton=n=>n===null||!Number.isFinite(n)?'—':(n/1000).toLocaleString(undefined,{maximumFractionDigits:1})+' T';
const pct=n=>{if(n===null||!Number.isFinite(n))return'—'; if(Math.abs(n)>5&&Math.abs(n)<=100)n/=100; return (n*100).toFixed(1)+'%'};
const parseDate=v=>{if(!v)return null;if(typeof v==='number'&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);return d?`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`:null} const s=String(v).slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null};
const color=['#087252','#efb400','#d56a32','#8f9b98','#3978a9','#9a6cb8'];
function destroyCharts(){state.charts.forEach(c=>c.destroy());state.charts=[]}
function lineChart(id,labels,sets){const ctx=document.getElementById(id);if(!ctx)return;state.charts.push(new Chart(ctx,{type:'line',data:{labels,datasets:sets.map((s,i)=>({label:s.label,data:s.data,borderColor:color[i%color.length],backgroundColor:color[i%color.length],tension:.25,pointRadius:2,borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},scales:{x:{ticks:{font:{size:9},maxRotation:0},grid:{display:false}},y:{ticks:{font:{size:9}},grid:{color:'#eef1ef'}}}}}))}

function normalizeWorkbook(wb){const sheets={};for(const s of REQUIRED_SHEETS){if(!wb.SheetNames.includes(s))throw new Error(`Missing sheet: ${s}`);const rows=XLSX.utils.sheet_to_json(wb.Sheets[s],{defval:null,raw:true});for(const r of rows){if('Date' in r)r.Date=parseDate(r.Date)}sheets[s]=rows}return{sheets,fileName:'Uploaded workbook',uploadedAt:new Date().toISOString()}}
function currentDateRows(name){let rows=(state.data?.sheets?.[name]||[]).slice();const f=$('#fromDate')?.value,t=$('#toDate')?.value;if(rows.length&&'Date' in rows[0])rows=rows.filter(r=>(!f||r.Date>=f)&&(!t||r.Date<=t));return rows}
function filteredBuyers(){let rows=(state.data?.sheets?.['Buyer Wise data']||[]).slice();const q=($('#search')?.value||'').trim().toLowerCase();const buyer=$('#buyerFilter')?.value||'';if(q)rows=rows.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));if(buyer)rows=rows.filter(r=>r.Buyer===buyer);return rows}
function setFilterDefaults(){const dated=['Dyeing','Knitting','Finishing','FFS'].flatMap(s=>(state.data?.sheets?.[s]||[]).map(r=>r.Date).filter(Boolean)).sort();if(dated.length){$('#fromDate').value=dated[0];$('#toDate').value=dated[dated.length-1]}const buyers=(state.data?.sheets?.['Buyer Wise data']||[]).map(r=>r.Buyer).filter(Boolean).sort();$('#buyerFilter').innerHTML='<option value="">All buyers</option>'+buyers.map(b=>`<option>${esc(b)}</option>`).join('');}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function kpi(label,value,sub=''){return`<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${value}</div><div class="sub">${esc(sub)}</div></div>`}
function tableHTML(rows,limit=500){if(!rows.length)return'<div class="alert">No records match the current filters.</div>';const cols=Object.keys(rows[0]);return`<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,limit).map(r=>`<tr>${cols.map(c=>{const v=r[c];const n=safeNum(v);let out=esc(v??'');if(c==='Date')out=esc(parseDate(v)||v||'');else if(/%|OTT|RFT|Util|uti|Efficiency|Loading|MLT|OTD|One Shot|Pass/i.test(c)&&n!==null)out=pct(n);else if(n!==null)out=n.toLocaleString(undefined,{maximumFractionDigits:2});return`<td class="${n!==null?'num':''}">${out}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}

function renderOverview(){const d=currentDateRows('Dyeing'),k=currentDateRows('Knitting'),f=currentDateRows('Finishing'),ff=currentDateRows('FFS'),b=filteredBuyers();metricCardSet([

kpi('Knitting production',ton(sum(k,'Daily Knitting Prod. (Overall)')),'Overall'),
kpi('Finishing handed over',ton(sum(f,'Handedover kg')),'Fabric handed over'),
kpi('Fabric delivered',ton(sum(ff,'Delivered')),'FFS delivery'),
kpi('Delivery OTD',pct(avg(ff,'OTD')),'Average of selected period'),

$('#content').innerHTML=panel('Daily production & delivery','Selected date range','<div class="chart-wrap"><canvas id="trend"></canvas></div>')+panel('Top buyers','Delivered fabric quantity','<div class="chart-wrap"><canvas id="buyers"></canvas></div>')+panel('Buyer-wise summary','Based on Buyer Wise data',tableHTML(b),true);
const labels=d.map(r=>r.Date?.slice(5)||'');const mapBy=(rows,key)=>Object.fromEntries(rows.map(r=>[r.Date,safeNum(r[key])||0]));const mk=mapBy(k,'Daily Knitting Prod. (Overall)'),mf=mapBy(f,'Handedover kg'),mff=mapBy(ff,'Delivered');lineChart('trend',labels,[{label:'Dyeing',data:d.map(r=>(safeNum(r['Prod. (EFL)'])||0)+(safeNum(r['Prod. (EKL+Ext)'])||0))},{label:'Knitting',data:d.map(r=>mk[r.Date]||0)},{label:'Finishing',data:d.map(r=>mf[r.Date]||0)},{label:'Delivery',data:d.map(r=>mff[r.Date]||0)}]);const top=b.slice().sort((a,z)=>(safeNum(z.Delivered)||0)-(safeNum(a.Delivered)||0)).slice(0,10);barChart('buyers',top.map(r=>r.Buyer),top.map(r=>safeNum(r.Delivered)||0));}
function renderDyeing(){const r=currentDateRows('Dyeing');metricCardSet([kpi('EFL production',ton(sum(r,'Prod. (EFL)'))),kpi('EKL + Ext production',ton(sum(r,'Prod. (EKL+Ext)'))),kpi('RFT EFL',pct(avg(r,'Dyeing RFT (EFL)'))),kpi('Capacity EFL',pct(avg(r,'Capacity Utilization (EFL)'))),kpi('Loading EFL',pct(avg(r,'Loading (EFL)'))),kpi('On-time',pct(avg(r,'On Time Target')))]);$('#content').innerHTML=panel('Dyeing production trend','EFL vs EKL + Extension','<div class="chart-wrap"><canvas id="trend"></canvas></div>')+panel('Daily dyeing data','All available fields',tableHTML(r),true);lineChart('trend',r.map(x=>x.Date?.slice(5)),[{label:'EFL',data:r.map(x=>safeNum(x['Prod. (EFL)'])||0)},{label:'EKL+Ext',data:r.map(x=>safeNum(x['Prod. (EKL+Ext)'])||0)},{label:'Pluvia',data:r.map(x=>safeNum(x['Pluvia'])||0)}]);}
function renderKnitting(){const r=currentDateRows('Knitting');const total=sum(r,'Daily Knitting Prod. (Overall)'),sc=sum(r,'Knitting SC Prod.');metricCardSet([kpi('Overall production',ton(total)),kpi('Sub-contract',ton(sc)),kpi('Sub-contract share',pct(total?sc/total:null)),kpi('MC utilization',pct(avg(r,'MC Utilization'))),kpi('Capacity utilization',pct(avg(r,'Capacity utilization'))),kpi('Overall OTT',pct(avg(r,'Overall OTT')))]);$('#content').innerHTML=panel('Knitting production trend','Overall vs sub-contract','<div class="chart-wrap"><canvas id="trend"></canvas></div>')+panel('Daily knitting data','All available fields',tableHTML(r),true);lineChart('trend',r.map(x=>x.Date?.slice(5)),[{label:'Overall',data:r.map(x=>safeNum(x['Daily Knitting Prod. (Overall)'])||0)},{label:'Sub-contract',data:r.map(x=>safeNum(x['Knitting SC Prod.'])||0)}]);}
function renderFinishing(){const r=currentDateRows('Finishing');metricCardSet([kpi('Heat set production',ton(sum(r,'Heat Set Production'))),kpi('Handed over',ton(sum(r,'Handedover kg'))),kpi('MLT',pct(avg(r,'MLT'))),kpi('Stenter utilization',pct(avg(r,'Stenter uti'))),kpi('Dryer utilization',pct(avg(r,'Dryer Uti'))),kpi('Compactor utilization',pct(avg(r,'Compactor Uti')))]);$('#content').innerHTML=panel('Finishing output trend','Heat set and handed-over fabric','<div class="chart-wrap"><canvas id="trend"></canvas></div>')+panel('Daily finishing data','All available fields',tableHTML(r),true);lineChart('trend',r.map(x=>x.Date?.slice(5)),[{label:'Heat Set',data:r.map(x=>safeNum(x['Heat Set Production'])||0)},{label:'Handed Over',data:r.map(x=>safeNum(x['Handedover kg'])||0)}]);}
function renderDelivery(){const r=currentDateRows('FFS');metricCardSet([kpi('Received',ton(sum(r,'Received'))),kpi('Delivered',ton(sum(r,'Delivered'))),kpi('OTD',pct(avg(r,'OTD'))),kpi('One Shot',pct(avg(r,'One Shot')),'Blank in current source'),kpi('Total excess',ton(sum(r,'Total Excess (Qty)'))),kpi('Excess %',pct(sum(r,'Delivered')?sum(r,'Total Excess (Qty)')/sum(r,'Delivered'):null))]);$('#content').innerHTML=panel('Receive vs delivery','Daily fabric quantity','<div class="chart-wrap"><canvas id="trend"></canvas></div>')+panel('Daily delivery data','FFS fields',tableHTML(r),true);lineChart('trend',r.map(x=>x.Date?.slice(5)),[{label:'Received',data:r.map(x=>safeNum(x.Received)||0)},{label:'Delivered',data:r.map(x=>safeNum(x.Delivered)||0)}]);}
function renderBuyers(){const r=filteredBuyers();metricCardSet([kpi('Buyers',fmt(r.length)),kpi('Received',ton(r.reduce((a,x)=>a+(safeNum(x.Received)||0),0))),kpi('Delivered',ton(r.reduce((a,x)=>a+(safeNum(x.Delivered)||0),0))),kpi('Dyeing production',ton(r.reduce((a,x)=>a+(safeNum(x['Dyeing Prod'])||0),0))),kpi('Knitting production',ton(r.reduce((a,x)=>a+(safeNum(x['Knitting Prod'])||0),0))),kpi('Total excess',ton(r.reduce((a,x)=>a+(safeNum(x['Total Excess (Qty)'])||0),0)))]);$('#content').innerHTML=panel('Buyer delivery comparison','Top delivered quantities','<div class="chart-wrap"><canvas id="buyers"></canvas></div>')+panel('Buyer-wise data','Search and buyer filters apply',tableHTML(r),true);const top=r.slice().sort((a,z)=>(safeNum(z.Delivered)||0)-(safeNum(a.Delivered)||0)).slice(0,12);barChart('buyers',top.map(x=>x.Buyer),top.map(x=>safeNum(x.Delivered)||0));}
function renderData(){metricCardSet([]);const d=state.data;$('#content').innerHTML=`<div class="section-title"><h2>Data Management</h2><span>Shared source workbook</span></div>${state.profile?.role==='admin'?`<div class="upload-box"><strong>Upload / Replace Excel Data</strong><div class="note">Required sheets: ${REQUIRED_SHEETS.join(', ')}</div><input id="fileInput" type="file" accept=".xlsx,.xls,.xlsb"><br><button class="btn primary" id="uploadBtn">Upload & Publish</button><div id="uploadStatus" style="margin-top:10px"></div></div>`:`<div class="alert">Viewer access: data upload is restricted to Admin users.</div>`}<div style="height:14px"></div><div class="panel"><h3>Current dataset</h3><div class="note">Visible to authenticated users</div><p><b>File:</b> ${esc(d?.fileName||'—')}</p><p><b>Last updated:</b> ${d?.uploadedAt?new Date(d.uploadedAt).toLocaleString():'—'}</p>${Object.entries(d?.sheets||{}).map(([k,v])=>`<span class="status-pill" style="margin:4px">${esc(k)}: ${v.length} rows</span>`).join('')}</div>`;if($('#uploadBtn'))$('#uploadBtn').onclick=handleUpload;}
function render(){if(!state.data)return;destroyCharts();$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const fns={overview:renderOverview,dyeing:renderDyeing,knitting:renderKnitting,finishing:renderFinishing,delivery:renderDelivery,buyers:renderBuyers,data:renderData};(fns[state.tab]||renderOverview)();$('#countText').textContent=state.tab==='buyers'?`${filteredBuyers().length} buyer records`:`${currentDateRows(state.tab==='dyeing'?'Dyeing':state.tab==='knitting'?'Knitting':state.tab==='finishing'?'Finishing':state.tab==='delivery'?'FFS':'Dyeing').length} daily records`;}
function bindUI(){$$('.nav button').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});['search','buyerFilter','fromDate','toDate'].forEach(id=>$('#'+id).addEventListener('input',render));$('#resetBtn').onclick=()=>{setFilterDefaults();$('#search').value='';$('#buyerFilter').value='';render()};$('#exportBtn').onclick=exportCurrent;}
function exportCurrent(){let rows=state.tab==='buyers'?filteredBuyers():state.tab==='dyeing'?currentDateRows('Dyeing'):state.tab==='knitting'?currentDateRows('Knitting'):state.tab==='finishing'?currentDateRows('Finishing'):state.tab==='delivery'?currentDateRows('FFS'):filteredBuyers();if(!rows.length)return;const ws=XLSX.utils.json_to_sheet(rows);const csv=XLSX.utils.sheet_to_csv(ws);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`Textile_Planning_${state.tab}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}

const sb=supabase.createClient(window.APP_CONFIG.SUPABASE_URL,window.APP_CONFIG.SUPABASE_ANON_KEY);
async function loadProfile(user){const {data,error}=await sb.from('profiles').select('display_name,role').eq('id',user.id).single();if(error)throw error;state.profile=data;return data}
async function loadData(){const {data,error}=await sb.from('dashboard_data').select('file_name,data,uploaded_at').eq('id',1).maybeSingle();if(error)throw error;if(!data){state.data={sheets:Object.fromEntries(REQUIRED_SHEETS.map(s=>[s,[]])),fileName:'No workbook uploaded',uploadedAt:null}}else{state.data={...data.data,fileName:data.file_name,uploadedAt:data.uploaded_at}}setFilterDefaults();document.getElementById('lastUpdated').textContent=state.data.uploadedAt?'Last updated: '+new Date(state.data.uploadedAt).toLocaleString():'';render()}
async function start(){const {data:{session}}=await sb.auth.getSession();if(!session)return;await enter(session.user)}
async function enter(user){try{const p=await loadProfile(user);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('greeting').textContent='Good morning, '+(p.display_name||user.email);bindUI();await loadData()}catch(e){document.getElementById('loginError').textContent=e.message}}
document.getElementById('loginBtn').onclick=async()=>{document.getElementById('loginError').textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('loginError').textContent=error.message;enter(data.user)};
document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('refreshBtn').onclick=loadData;
async function handleUpload(){const inp=document.getElementById('fileInput'),f=inp.files[0],st=document.getElementById('uploadStatus');if(!f)return st.textContent='Choose an Excel file first.';try{st.textContent='Reading workbook...';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const parsed=normalizeWorkbook(wb);parsed.fileName=f.name;parsed.uploadedAt=new Date().toISOString();st.textContent='Publishing shared data...';const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('dashboard_data').upsert({id:1,file_name:f.name,data:parsed,uploaded_by:user.id,uploaded_at:new Date().toISOString()},{onConflict:'id'});if(error)throw error;st.textContent='Published successfully.';await loadData()}catch(e){st.textContent='Upload failed: '+e.message}}
start();</script></body></html>
