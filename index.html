/* v5 focused UI refinements */
.kpi:after{display:none!important}
.kpi-inline-target{font-size:18px!important;gap:2px!important;line-height:1.05;letter-spacing:-.15px}
.kpi-inline-target .slash{margin:0 1px!important}
.panel{position:relative;min-width:0;max-width:100%}
.chart-wrap{position:relative;width:100%;min-width:0;max-width:100%;overflow:hidden}
.chart-wrap canvas{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important}
.panel-expand-btn{position:absolute;top:9px;right:9px;width:28px;height:28px;border:1px solid #d4dfda;background:rgba(255,255,255,.92);color:#075b45;border-radius:5px;display:grid;place-items:center;padding:0;font-size:16px;line-height:1;font-weight:800;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:transform .15s ease,border-color .15s ease,background .15s ease}

.panel:fullscreen .chart-wrap,.panel:-webkit-full-screen .chart-wrap{height:calc(100vh - 105px);min-height:520px}
.panel:fullscreen .panel-expand-btn,.panel:-webkit-full-screen .panel-expand-btn{position:fixed;top:16px;right:18px;width:34px;height:34px;font-size:19px}

:root{--snap-ok:#1f9d63;--snap-watch:#f0b400;--snap-critical:#d9543a;--snap-neutral:#75847d}
.kpis.overview-kpis{display:none!important}
.snapshot-shell{
  grid-column:1/-1;background:var(--bg);border-radius:10px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 5px 18px rgba(16,61,46,.08)
}
.snapshot-head{
  background:linear-gradient(120deg,#064c3a,#0a7d5b);color:#fff;
  padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px
}
.snapshot-head h2{margin:0;font:700 20px Georgia,serif}
.snapshot-head small{display:block;font-size:9px;letter-spacing:1.7px;opacity:.82;margin-top:3px}
.snapshot-period{text-align:right;font-size:9px;opacity:.88}
.snapshot-period b{display:block;font-size:13px;margin-top:2px;color:#fff}
.snapshot-kp{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--card);
  border-bottom:3px solid var(--snap-watch)
}
.snapshot-kp-item{
  position:relative;padding:9px 7px 8px;text-align:center;border-right:1px solid var(--line);min-width:0
}
.snapshot-kp-item:last-child{border-right:0}
.snapshot-kp-item:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--snap-neutral)}
.snapshot-kp-item.st-ok:after{background:var(--snap-ok)}
.snapshot-kp-item.st-watch:after{background:var(--snap-watch)}
.snapshot-kp-item.st-critical:after{background:var(--snap-critical)}
.snapshot-kp-item small{display:block;font-size:8.7px;color:var(--muted);text-transform:uppercase;letter-spacing:.45px}
.snapshot-kp-item b{display:block;font:700 18px Georgia,serif;color:var(--green);margin:3px 0 1px;white-space:nowrap}
.snapshot-kp-item i{font-style:normal;font-size:8.7px;font-weight:800}
.snapshot-kp-item.st-ok i{color:var(--snap-ok)}.snapshot-kp-item.st-watch i{color:#a87900}
.snapshot-kp-item.st-critical i{color:var(--snap-critical)}.snapshot-kp-item.st-neutral i{color:var(--snap-neutral)}
.snapshot-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:8px}
.snap-c3{grid-column:span 3}.snap-c2{grid-column:span 2}.snap-c6{grid-column:span 6}
.snap-card{
  --tone:#0a7d5b;background:var(--card);border-radius:8px;border-top:3px solid var(--tone);
  padding:7px 10px;box-shadow:0 2px 8px rgba(26,69,54,.06);min-width:0
}
.snap-card.tone-green{--tone:#13845f}.snap-card.tone-blue{--tone:#367fb9}.snap-card.tone-purple{--tone:#8669c7}
.snap-card.tone-orange{--tone:#e99335}.snap-card.tone-teal{--tone:#188f99}.snap-card.tone-rose{--tone:#d26183}.snap-card.tone-amber{--tone:#d9aa24}
.snap-card.card-ok{border-top-color:var(--snap-ok)}.snap-card.card-watch{border-top-color:var(--snap-watch)}
.snap-card.card-critical{border-top-color:var(--snap-critical)}.snap-card.card-neutral{border-top-color:var(--tone)}
.snap-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.snap-card-head b{font:700 14px Georgia,serif;color:#153f32}.snap-card-head span{font:700 14px Georgia,serif;color:var(--green);white-space:nowrap}
.snap-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2.5px 0;border-top:1px solid var(--line);min-height:25px}
.snap-row>span:first-child{color:var(--muted);font-size:9.5px}
.snap-pill{display:inline-block;min-width:58px;text-align:center;padding:2px 6px;border-radius:99px;font-weight:800;font-size:10px;color:#fff;white-space:nowrap}
.snap-pill.st-ok{background:var(--snap-ok)}.snap-pill.st-watch{background:var(--snap-watch);color:#4a3600}
.snap-pill.st-critical{background:var(--snap-critical)}.snap-pill.st-neutral{background:#e8efec;color:#40544c}
.snap-tiles{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:6px;margin-top:4px}
.snap-tile{
  position:relative;border-radius:7px;padding:7px 8px 17px;border-left:3px solid var(--snap-neutral);
  background:#eef2f0;min-height:66px;overflow:hidden
}
.snap-tile.st-ok{border-left-color:var(--snap-ok);background:#e6f5ee}
.snap-tile.st-watch{border-left-color:#a87900;background:#fff4cf}
.snap-tile.st-critical{border-left-color:#c23f27;background:#fde6e1}
.snap-tile small{font-size:9px;color:var(--muted);line-height:1.2;display:block}
.snap-tile b{font:700 17px Georgia,serif;color:#243c34;display:block;margin-top:2px}
.snap-tile em{font-style:normal;font-size:8.5px;color:#66766f;display:block;margin-top:2px}
.snap-state{position:absolute;right:5px;bottom:3px;font-size:7.5px;font-weight:800;text-transform:uppercase;letter-spacing:.35px;color:#6d7a74}
.snap-dye-table{width:100%;border-collapse:collapse}
.snap-dye-table th{font-size:8px;color:var(--muted);font-weight:600;padding:2px;text-align:center}
.snap-dye-table td{padding:2px;border-top:1px solid var(--line);text-align:center;font-size:9px}
.snap-dye-table td:first-child{text-align:left;color:var(--muted)}
.snap-chart.panel{padding:7px 10px;min-height:130px}
.snap-chart.panel h3{font-size:12.5px;margin-bottom:1px}
.snap-chart.panel .note{font-size:8.5px;margin-bottom:3px}
.snap-chart .chart-wrap{height:82px!important}
.snapshot-footer{
  display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;
  background:var(--card);border-top:1px solid var(--line);font-size:9px;color:var(--muted)
}
.snapshot-legend span{margin-left:10px;white-space:nowrap}
.snapshot-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.snapshot-target-note{font-size:8.7px;color:var(--muted)}
body.dark-mode .snapshot-shell{background:#111b17}
body.dark-mode .snapshot-kp,.dark-mode .snap-card,.dark-mode .snapshot-footer{background:#17231e}
body.dark-mode .snapshot-kp-item b,.dark-mode .snap-card-head span{color:#c9f2df}
body.dark-mode .snap-card-head b{color:#d9eee5}
body.dark-mode .snap-pill.st-neutral{background:#2c3c35;color:#d1dfd9}
body.dark-mode .snap-tile{background:#22302a}
body.dark-mode .snap-tile.st-ok{background:#17382b}.dark-mode .snap-tile.st-watch{background:#413715}
body.dark-mode .snap-tile.st-critical{background:#44231d}
@media(max-width:900px){.snap-dye-compare{width:100%}.snapshot-kp{grid-template-columns:repeat(4,minmax(0,1fr))}.snap-c3,.snap-c2{grid-column:span 6}}

function normalizeETLWorkbook(wb){
  const sn='ETL_Date';
  if(!wb.SheetNames.includes(sn))throw new Error(`Missing sheet: ${sn}`);

  // Excel/SheetJS may return the same visible header with different line breaks,
  // spacing or punctuation. Match headers by a stable alphanumeric signature.
  const headerSig=v=>String(v??'')
    .replace(/\r\n?/g,'\n')
    .replace(/;/g,':')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g,'');

  const required=['Date',...ETL_COUNT,...ETL_PERCENT,...ETL_DURATION];
  const rawRows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null,raw:true});
  if(!rawRows.length)throw new Error(`${sn} has no data rows.`);

  const actualHeaders=Object.keys(rawRows[0]);
  const actualBySig=new Map(actualHeaders.map(h=>[headerSig(h),h]));
  const canonicalToActual=new Map();

  for(const canonical of required){
    const actual=actualBySig.get(headerSig(canonical));
    if(actual)canonicalToActual.set(canonical,actual);
  }

  const miss=required.filter(c=>!canonicalToActual.has(c));
  if(miss.length){
    throw new Error(`${sn} missing column(s): ${miss.join(', ')}`);
  }

  // Rebuild every row with stable canonical keys so all downstream ETL logic
  // is independent of how Excel stores line breaks/spaces in the headers.
  const rows=rawRows.map(raw=>{
    const r={...raw};
    for(const canonical of required){
      r[canonical]=raw[canonicalToActual.get(canonical)];
    }
    return r;
  });

  for(const r of rows){
    r.Date=parseDate(r.Date);
    for(const c of ETL_COUNT){
      const n=safeNum(r[c]);
      r[c]=n===null?null:n;
    }
    for(const c of ETL_PERCENT){
      const n=safeNum(r[c]);
      r[c]=n===null?null:((Math.abs(n)>1.5&&Math.abs(n)<=100)?n/100:n);
    }
    for(const c of ETL_DURATION){
      const sec=durationSeconds(r[c]);
      r[c]=sec===null?null:sec;
    }
  }

  const usable=rows.filter(r=>
    r.Date&&[...ETL_COUNT,...ETL_PERCENT,...ETL_DURATION]
      .some(c=>r[c]!==null&&r[c]!==undefined&&r[c]!=='')
  );

  usable.sort((a,b)=>a.Date.localeCompare(b.Date));
  if(!usable.length)throw new Error('ETL_Date has no usable rows.');

  const seen=new Set();
  for(const r of usable){
    if(seen.has(r.Date))throw new Error(`Duplicate Date found in ETL_Date: ${r.Date}`);
    seen.add(r.Date);
  }
  return {[sn]:usable};
}

function etlTableHTML(rows,limit=500){
  if(!rows.length)return '<div class="empty">No ETL records for the current filter.</div>';
  const cols=['Date',...ETL_COUNT,...ETL_PERCENT,...ETL_DURATION],show=rows.slice(0,limit);
  let h='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c).replace(/\\n/g,'<br>')}</th>`).join('')+'</tr></thead><tbody>';
  for(const r of show){
    h+='<tr>'+cols.map(c=>{
      let v=r[c];
      if(ETL_DURATION.includes(c))v=formatDuration(v,true);
      else if(ETL_PERCENT.includes(c))v=pct(safeNum(v));
      else if(ETL_COUNT.includes(c))v=fmt(safeNum(v));
      return `<td${c!=='Date'?' class="num"':''}>${esc(v??'')}</td>`;
    }).join('')+'</tr>';
  }
  return h+'</tbody></table></div>'
}

function targetSig(v){return String(v??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'')}
function targetKey(department,kpi){return `${targetSig(department)}|${targetSig(kpi)}`}

function inferTargetDirection(topic,raw=''){
  const s=`${topic} ${raw}`.toLowerCase();
  if(/[≤<]/.test(String(raw))||/\b(limit|reprocess|reject|rejection|hold|jhut|conditional|subcontract|excess|additional|slt|booking|first batch|report time|defect)\b/.test(s))return'Lower';
  if(/[≥>]/.test(String(raw)))return'Higher';
  return'Higher'
}
function parseTargetNumber(raw,topic='',department=''){
  if(raw===null||raw===undefined||String(raw).trim()==='')return null;
  const s=String(raw).trim().replace(/,/g,'').replace(/[–—]/g,'-');
  const lower=s.toLowerCase();
  const percentLike=/%/.test(s)||/(otd|ott|rft|utilization|util\.|efficiency|pass|reject|rejection|hold|reprocess|subcontract|defect|excess|additional|mlt)/i.test(topic);

  // Elapsed time targets such as ≤24 Hr, ≤5:10, 48 Hrs.
  if(/hr|hrs|hour|min|:/.test(lower) && !/ton|mt|kg/.test(lower)){
    const hhmm=s.match(/(\d+(?:\.\d+)?)\s*:\s*(\d{1,2})(?:\s*:\s*(\d{1,2}))?/);
    if(hhmm)return Number(hhmm[1])*3600+Number(hhmm[2])*60+Number(hhmm[3]||0);
    const hr=s.match(/(\d+(?:\.\d+)?)\s*(?:hr|hrs|hour|hours)/i);
    if(hr)return Number(hr[1])*3600;
  }

  const m=s.match(/-?\d+(?:\.\d+)?/);
  if(!m)return null;
  let n=Number(m[0]);
  if(!Number.isFinite(n))return null;
  if(percentLike){
    if(Math.abs(n)>1.5)n/=100;
    return n
  }
  return n
}
function sourceTargetRows(wb){
  if(!wb.SheetNames.includes(TARGET_SHEET))throw new Error(`Missing sheet: ${TARGET_SHEET}`);
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[TARGET_SHEET],{defval:null,raw:true});
  if(!raw.length)throw new Error('Target sheet has no rows.');
  const headers=Object.keys(raw[0]),bySig=new Map(headers.map(h=>[targetSig(h),h]));
  const depH=bySig.get(targetSig('Department')),topicH=bySig.get(targetSig('Topics')),targetH=bySig.get(targetSig('Target'));
  const miss=[];if(!depH)miss.push('Department');if(!topicH)miss.push('Topics');if(!targetH)miss.push('Target');
  if(miss.length)throw new Error(`Target missing column(s): ${miss.join(', ')}`);
  return raw.map(r=>({
    Department:String(r[depH]??'').trim(),
    Topics:String(r[topicH]??'').trim(),
    RawTarget:r[targetH]
  })).filter(r=>r.Department&&r.Topics&&r.RawTarget!==null&&r.RawTarget!==undefined&&String(r.RawTarget).trim()!=='')
}
function normalizeTargetWorkbook(wb){
  const src=sourceTargetRows(wb);
  const by=(dep,topic)=>src.find(r=>targetSig(r.Department)===targetSig(dep)&&targetSig(r.Topics)===targetSig(topic));
  const byContains=(dep,words)=>src.find(r=>targetSig(r.Department)===targetSig(dep)&&words.every(w=>targetSig(r.Topics).includes(targetSig(w))));
  const parsed=(row,unit,opts={})=>{
    if(!row)return null;
    let value=parseTargetNumber(row.RawTarget,row.Topics,row.Department);
    if(value===null)return null;

    if(opts.multiplyBy)value*=opts.multiplyBy;

  };

    if(!obj||obj.value===null||!Number.isFinite(Number(obj.value)))return;
    out.push({Department,KPI,Target:Number(obj.value),Direction:obj.direction||'Higher','Watch %':.10,Unit:obj.unit||'Number',Notes:notes||`${obj.source} | Source target: ${obj.raw}`})
  };

  // Delivery
  add('Delivery','Delivered Avg/day',parsed(by('Delivery','Daily Target'),'T/day'));
  add('Delivery','On Time Delivery',parsed(by('Delivery','OTD'),'%'));
  const excess=parsed(by('Delivery','Excess Delivery without PO'),'%',{direction:'Lower'});
  const additional=parsed(by('Delivery','Additional Delivery'),'%',{direction:'Lower'});
  if(excess&&additional)add('Delivery','Total Excess %',{value:excess.value+additional.value,direction:'Lower',unit:'%',source:'Delivery excess + additional',raw:`${excess.raw} + ${additional.raw}`},'Derived from Excess Delivery without PO + Additional Delivery');

  // Knitting
  add('Knitting','Overall Prod Avg/day',parsed(by('Knitting','Daily Target'),'T/day'));
  add('Knitting','Subcontract Share',parsed(by('Knitting','Knitting Subcontract'),'%',{direction:'Lower'}));
  add('Knitting','MC Utilization',parsed(by('Knitting','MC Utilization'),'%'));
  add('Knitting','Overall OTT',parsed(by('Knitting','Overall OTT'),'%'));
  add('Knitting','Prod/MC',parsed(by('Knitting','Prod. / MC (kg)'),'kg'));
  const yarnBooking=parsed(by('Knitting','Yarn Booking'),'seconds',{direction:'Lower'});
  if(yarnBooking)add('Knitting','Yarn Booking',{...yarnBooking,value:yarnBooking.value/86400,unit:'days'},'Source target converted from hours to days');

  // Dyeing - two source departments are combined into current dashboard structure.
  const eflDaily=parsed(by('EFL Dyeing','Daily Dyeing Target'),'T/day');
  const eklDaily=parsed(by('EKL + Ext Dyeing','Daily Dyeing Target'),'T/day');
  const plE=parsed(by('EFL Dyeing','Daily Pluvia Wash'),'T/day');
  const plX=parsed(by('EKL + Ext Dyeing','Daily Pluvia Wash'),'T/day');
  add('Dyeing','EFL Avg/day',eflDaily);
  add('Dyeing','EKL+Ext Avg/day',eklDaily);
  const pluvia=plE||plX;
  add('Dyeing','Pluvia Avg/day',pluvia);
  if(eflDaily&&eklDaily&&pluvia)add('Dyeing','Total Prod Avg/day',{value:eflDaily.value+eklDaily.value+pluvia.value,direction:'Higher',unit:'T/day',source:'EFL + EKL+Ext + Pluvia daily targets',raw:'Derived'},'Derived: EFL Daily Dyeing + EKL+Ext Daily Dyeing + one Pluvia daily target');
  const rftE=parsed(by('EFL Dyeing','Dyeing RFT'),'%'),rftX=parsed(by('EKL + Ext Dyeing','Dyeing RFT'),'%');
  add('Dyeing','RFT EFL',rftE);
  add('Dyeing','RFT EKL+Ext',rftX);
  if(rftE||rftX)add('Dyeing','Overall RFT',{...(rftE||rftX),value:Math.min(...[rftE?.value,rftX?.value].filter(v=>v!==undefined))},'Uses the stricter/lower of EFL and EKL+Ext RFT targets');

  const capE=parsed(by('EFL Dyeing','Capacity Utilization'),'%'),capX=parsed(by('EKL + Ext Dyeing','Capacity Utilization'),'%');
  add('Dyeing','Capacity Utilization EFL',capE);
  add('Dyeing','Capacity Utilization EKL+Ext',capX);

  const otE=parsed(by('EFL Dyeing','On Time Target'),'%'),otX=parsed(by('EKL + Ext Dyeing','On Time Target'),'%');
  add('Dyeing','On Time Target EFL',otE);
  add('Dyeing','On Time Target EKL+Ext',otX);
  if(otE||otX)add('Dyeing','On Time Target',{...(otE||otX),value:Math.min(...[otE?.value,otX?.value].filter(v=>v!==undefined))},'Uses the stricter/lower of EFL and EKL+Ext On Time targets');

  const repE=parsed(by('EFL Dyeing','Reprocess'),'%',{direction:'Lower'}),repX=parsed(by('EKL + Ext Dyeing','Reprocess'),'%',{direction:'Lower'});

  const bmdE=parsed(by('EFL Dyeing','Batch/MC/Day'),'Number'),bmdX=parsed(by('EKL + Ext Dyeing','Batch/MC/Day'),'Number');
  add('Dyeing','B/M/D EFL',bmdE);

  if(bmdE||bmdX)add('Dyeing','Batch/MC/Day',{value:(bmdE?.value||0)+(bmdX?.value||0),direction:'Higher',unit:'Number',source:'EFL + EKL+Ext B/M/D targets',raw:'Derived'},'Combined target because Overview B/M/D is a combined EFL + EKL/Ext measure');

  // Finishing
  add('Finishing','Handedover Avg/day',parsed(by('Finishing','Daily In-House Handed Over Target'),'T/day'));

  if(single)add('Finishing','First Batch Single',{...single,value:single.value/86400,unit:'days'},'Converted from source hours to days');
  if(dbl)add('Finishing','First Batch Double',{...dbl,value:dbl.value/86400,unit:'days'},'Converted from source hours to days');

  // Yarn Dyeing
  let ydDaily=parsed(by('Yarn Dyeing','Delivery/Day'),'T/day');
  if(ydDaily&&ydDaily.value>=1000){
    // The source says "≥5,000 Ton" while the yearly target is only 1,658 Ton.
    // Interpret the daily entry as 5,000 kg/day = 5 T/day and keep that assumption visible.
    ydDaily={...ydDaily,value:ydDaily.value/1000,raw:`${ydDaily.raw} (interpreted as kg/day)`}
  }
  add('Yarn Dyeing','Overall Prod Avg/day',ydDaily,'Source Daily Delivery value is interpreted in dashboard T/day; ≥5,000 is treated as 5.0 T/day because it is inconsistent with the 1,658 Ton yearly target if read literally as tons/day');
  add('Yarn Dyeing','Capacity Utilization',parsed(by('Yarn Dyeing','Capacity Utilization'),'%'));
  add('Yarn Dyeing','B/M/D',parsed(by('Yarn Dyeing','B/M/D'),'Number'));
  add('Yarn Dyeing','YD OTD',parsed(by('Yarn Dyeing','OTD'),'%'));

  // Chemical Lab
  add('Chemical Lab','Overall SLT',parsed(by('Chemical Lab','SLT'),'HH:MM:SS',{direction:'Lower'}));
  add('Chemical Lab','Overall RFT',parsed(by('Chemical Lab','Overall RFT'),'%'));

  // ETL
  add('ETL','ETL OTD',parsed(by('ETL','Report OTD'),'%'));
  add('ETL','Flat Dry 1 Wash',parsed(byContains('ETL',['One wash','Flat Dry','Report Time']),'HH:MM:SS',{direction:'Lower'}));
  add('ETL','Line Dry 1 Wash',parsed(byContains('ETL',['One wash','Line Dry','Report Time']),'HH:MM:SS',{direction:'Lower'}));
  add('ETL','Tumble Dry 1 Wash',parsed(byContains('ETL',['One wash','Tumble Dry','Report Time']),'HH:MM:SS',{direction:'Lower'}));

  return out
}

function targetFor(department,kpi){return targetMap().get(targetKey(department,kpi))||null}
function targetStatus(department,kpi,actual){
  const t=targetFor(department,kpi);
  if(actual===null||actual===undefined||actual==='')return{code:'neutral',label:'No data',target:t};
  const a=Number(actual);
  if(!t||!Number.isFinite(a))return{code:'neutral',label:t?'No data':'No target',target:t};
  const target=Number(t.Target),watch=Math.max(0,Number(t['Watch %']??.10)),margin=Math.abs(target)*watch;
  let code='critical';
  if(String(t.Direction).toLowerCase()==='lower'){
    if(a<=target)code='ok';
    else if(a<=target+margin)code='watch';
  }else{
    if(a>=target)code='ok';
    else if(a>=target-margin)code='watch';
  }
  return{code,label:code==='ok'?'On target':code==='watch'?'Watch':'Critical',target:t}
}
function worstStatus(list){
  const rank={neutral:0,ok:1,watch:2,critical:3};let best={code:'neutral',label:'No target'};
  for(const x of list||[])if((rank[x?.code]||0)>(rank[best.code]||0))best=x;

}

async function loadProfile(user){const {data,error}=await sb.from('profiles').select('id,display_name,role,permissions,active').eq('id',user.id).single();if(error)throw error;if(data.active===false)throw new Error('Your dashboard access is disabled. Please contact an administrator.');state.profile=data;return data}
