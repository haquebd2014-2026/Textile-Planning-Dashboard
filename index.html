an class="mini-label">Dataset</span><span class="status-pill">Live data</span></div></div><div class="toolbar-bottom"><span id="countText"></span><span id="lastUpdated"></span></div></section><section class="kpis" id="kpis"></section><section class="grid" id="content"></section></main></div><div id="login" class="login-shell"><div class="login-card"><div class="brand-row"><div class="brand-mark">TP</div><div><div class="brand-title">Textile Planning Dashboard</div><div class="brand-sub">Planning, Monitoring & Control</div></div></div><h2>Authorized access</h2><p>Sign in to view the shared planning dashboard.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn" style="width:100%">Sign in</button><div class="error" id="loginError"></div></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>const REQUIRED_SHEETS=['Dyeing','Knitting','Finishing','FFS','Buyer Wise data'];

const safeNum=v=>{if(v===null||v===undefined||v===''||String(v).trim().startsWith('#'))return null;if(typeof v==='number')return Number.isFinite(v)?v:null;let s=String(v).trim().replace(/,/g,'');if(!s)return null;if(s.endsWith('%')){const n=parseFloat(s.slice(0,-1));return Number.isFinite(n)?n/100:null}const n=Number(s);return Number.isFinite(n)?n:null};

function renderUsers(){metricCardSet([]);$('#content').innerHTML=`<div class="panel"><h3 id="userFormTitle">Create New User</h3><div class="note">Create an authorized login and choose which dashboard menus the user can open.</div><div class="user-form-grid"><div><div class="mini-label">Display name</div><input class="form-control" id="userName" placeholder="User name"></div><div><div class="mini-label">Email</div><input class="form-control" id="userEmail" type="email" placeholder="name@company.com"></div><div><div class="mini-label">Password</div><input class="form-control" id="userPassword" type="password" placeholder="Minimum 6 characters"></div><div><div class="mini-label">Role</div><select class="form-control" id="userRole"><option value="viewer">Viewer</option><option value="admin">Admin</option></select></div></div><div style="margin-top:14px"><div class="mini-label">Menu permissions</div><div class="perm-grid" id="permissionGrid">${permissionCheckboxes(DEFAULT_PERMISSIONS,'viewer')}</div><label class="perm-item" style="max-width:220px"><input type="checkbox" id="userActive" checked><span>Active user</span></label></div><div class="user-actions" style="margin-top:14px"><button class="btn primary" id="saveUserBtn">Create User</button><button class="btn hidden" id="cancelUserBtn">Cancel Edit</button></div><div class="user-status" id="userStatus"></div></div><div class="panel"><h3>Authorized Users</h3><div class="note">Edit role, status, and menu access. User Management is Admin-only.</div><div id="usersTable" class="table-wrap compact-table"><div style="padding:18px" class="muted">Loading users...</div></div></div>`;$('#userRole').onchange=syncUserRoleForm;$('#saveUserBtn').onclick=saveUser;$('#cancelUserBtn').onclick=resetUserForm;loadUsers();}
function syncUserRoleForm(){const role=$('#userRole').value;$$('.perm-box').forEach(c=>{c.disabled=role==='admin';if(role==='admin')c.checked=true});}
function collectPermissions(){const out={...DEFAULT_PERMISSIONS};$$('.perm-box').forEach(c=>out[c.dataset.perm]=c.checked);out.users=false;return out;}
async function invokeUserAdmin(body){const {data,error}=await sb.functions.invoke('manage-users',{body});if(error)throw error;if(data?.error)throw new Error(data.error);return data;}
async function loadUsers(){try{const d=await invokeUserAdmin({action:'list'});state.userList=d.users||[];renderUsersTable()}catch(e){$('#usersTable').innerHTML=`<div class="alert">User list could not load: ${esc(e.message)}. Confirm the manage-users Edge Function has been deployed.</div>`}}
function renderUsersTable(){const rows=state.userList;if(!rows.length){$('#usersTable').innerHTML='<div style="padding:18px" class="muted">No users found.</div>';return}const body=rows.map(u=>{const perms=u.role==='admin'?MENU_DEFS.map(m=>m.label):MENU_DEFS.filter(m=>u.permissions?.[m.key]).map(m=>m.label);return `<tr><td><b>${esc(u.display_name||'—')}</b></td><td>${esc(u.email||'—')}</td><td><span class="badge ${u.role==='admin'?'admin':''}">${esc(u.role||'viewer')}</span></td><td><span class="badge ${u.active===false?'off':''}">${u.active===false?'Disabled':'Active'}</span></td><td class="menu-list">${esc(perms.join(', ')||'No menus')}</td><td><div class="user-actions"><button class="btn edit-user" data-id="${esc(u.id)}">Edit</button><button class="btn danger delete-user" data-id="${esc(u.id)}" ${u.id===state.profile?.id?'disabled title="You cannot delete your own account"':''}>Delete</button></div></td></tr>`}).join('');$('#usersTable').innerHTML=`<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Allowed menus</th><th>Actions</th></tr></thead><tbody>${body}</tbody></table>`;$$('.edit-user').forEach(b=>b.onclick=()=>editUser(b.dataset.id));$$('.delete-user').forEach(b=>b.onclick=()=>deleteUser(b.dataset.id));}
function editUser(id){const u=state.userList.find(x=>x.id===id);if(!u)return;state.editingUserId=id;$('#userFormTitle').textContent='Edit User';$('#userName').value=u.display_name||'';$('#userEmail').value=u.email||'';$('#userEmail').disabled=true;$('#userPassword').value='';$('#userPassword').placeholder='Leave blank to keep password';$('#userRole').value=u.role||'viewer';$('#userActive').checked=u.active!==false;$('#permissionGrid').innerHTML=permissionCheckboxes(u.permissions||DEFAULT_PERMISSIONS,u.role||'viewer');$('#saveUserBtn').textContent='Save Changes';$('#cancelUserBtn').classList.remove('hidden');syncUserRoleForm();window.scrollTo({top:0,behavior:'smooth'});}
function resetUserForm(){state.editingUserId=null;$('#userFormTitle').textContent='Create New User';$('#userName').value='';$('#userEmail').value='';$('#userEmail').disabled=false;$('#userPassword').value='';$('#userPassword').placeholder='Minimum 6 characters';$('#userRole').value='viewer';$('#userActive').checked=true;$('#permissionGrid').innerHTML=permissionCheckboxes(DEFAULT_PERMISSIONS,'viewer');$('#saveUserBtn').textContent='Create User';$('#cancelUserBtn').classList.add('hidden');$('#userStatus').textContent='';syncUserRoleForm();}
async function saveUser(){const st=$('#userStatus');const name=$('#userName').value.trim(),email=$('#userEmail').value.trim(),password=$('#userPassword').value,role=$('#userRole').value,active=$('#userActive').checked,permissions=collectPermissions();if(!name)return st.textContent='Enter a display name.';if(!state.editingUserId&&!email)return st.textContent='Enter an email address.';if(!state.editingUserId&&password.length<6)return st.textContent='Password must be at least 6 characters.';const payload=state.editingUserId?{action:'update',user_id:state.editingUserId,display_name:name,role,active,permissions,password:password||undefined}:{action:'create',email,password,display_name:name,role,active,permissions};try{$('#saveUserBtn').disabled=true;st.textContent=state.editingUserId?'Saving changes...':'Creating user...';await invokeUserAdmin(payload);st.textContent='Saved successfully.';resetUserForm();await loadUsers()}catch(e){st.textContent='Failed: '+e.message}finally{$('#saveUserBtn').disabled=false}}
async function deleteUser(id){const u=state.userList.find(x=>x.id===id);if(!u||id===state.profile?.id)return;if(!confirm(`Delete ${u.display_name||u.email}? This removes the login account.`))return;try{await invokeUserAdmin({action:'delete',user_id:id});await loadUsers()}catch(e){alert('Delete failed: '+e.message)}}
function renderData(){metricCardSet([]);const d=state.data;const dyeMeta=d?.departmentFiles?.dyeing;$('#content').innerHTML=`<div class="section-title"><h2>Data Management</h2><span>Department-wise source files</span></div>${state.profile?.role==='admin'?`<div class="dept-upload-grid"><div class="dept-card"><h3>Dyeing Data</h3><div class="meta">Required workbook: <b>Dyeing_Dashboard</b><br>Required sheets: <b>Dyeing_Date_Buyer</b> and <b>Dyeing_Date</b><br>Recommended maximum: ${MAX_DYEING_FILE_MB} MB</div><input id="dyeingFileInput" type="file" accept=".xlsx,.xls,.xlsb"><br><button class="btn primary" id="dyeingUploadBtn">Upload / Replace Dyeing</button><div id="dyeingUploadStatus" style="margin-top:10px"></div></div><div class="dept-card pending"><h3>Knitting Data</h3><div class="meta">Existing data remains unchanged.<br>Separate-file conversion will be added when Knitting is prepared.</div></div><div class="dept-card pending"><h3>Finishing Data</h3><div class="meta">Existing data remains unchanged.<br>Separate-file conversion will be added later.</div></div><div class="dept-card pending"><h3>Delivery Data</h3><div class="meta">Existing data remains unchanged.<br>Separate-file conversion will be added later.</div></div></div>`:`<div class="alert">Viewer access: data upload is restricted to Admin users.</div>`}<div style="height:14px"></div><div class="panel"><h3>Current Dyeing dataset</h3><div class="note">Visible to authenticated users with Dyeing menu permission</div><p><b>File:</b> ${esc(dyeMeta?.fileName||((d?.sheets?.Dyeing_Date_Buyer||[]).length?'Dyeing file uploaded':'—'))}</p><p><b>Last updated:</b> ${dyeMeta?.uploadedAt?new Date(dyeMeta.uploadedAt).toLocaleString():'—'}</p><p><b>Usable source period:</b> ${esc(dyeMeta?.dateFrom||'—')} to ${esc(dyeMeta?.dateTo||'—')}</p><span class="status-pill" style="margin:4px">Dyeing_Date_Buyer: ${(d?.sheets?.Dyeing_Date_Buyer||[]).length} rows</span><span class="status-pill" style="margin:4px">Dyeing_Date: ${(d?.sheets?.Dyeing_Date||[]).length} rows</span></div>`;if($('#dyeingUploadBtn'))$('#dyeingUploadBtn').onclick=handleDyeingUpload;}
function render(){if(!state.data)return;destroyCharts();applyMenuPermissions();syncBuyerOptions(false);const special=['data','users'].includes(state.tab);$('.toolbar').classList.toggle('hidden',special);$('#exportBtn').classList.toggle('hidden',special);$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));const fns={overview:renderOverview,dyeing:renderDyeing,knitting:renderKnitting,finishing:renderFinishing,delivery:renderDelivery,buyers:renderBuyers,data:renderData,users:renderUsers};(fns[state.tab]||renderOverview)();if(special){$('#countText').textContent='';return}if(state.tab==='dyeing')$('#countText').textContent=`${dyeingBuyerRows().length} buyer/date records • ${dyeingDateRows().length} overall date records`;else $('#countText').textContent=state.tab==='buyers'?`${filteredBuyers().length} buyer records`:`${currentDateRows(state.tab==='knitting'?'Knitting':state.tab==='finishing'?'Finishing':state.tab==='delivery'?'FFS':'Dyeing').length} daily records`;}
let swElapsed=0,swStartedAt=null,swTimer=null;
function updateStopwatch(){const el=$('#stopwatchText');if(!el)return;const ms=swElapsed+(swStartedAt?Date.now()-swStartedAt:0),sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60;el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function toggleStopwatch(){const btn=$('#stopwatchBtn');if(swTimer){swElapsed+=Date.now()-swStartedAt;swStartedAt=null;clearInterval(swTimer);swTimer=null;btn?.classList.remove('active-tool')}else{swStartedAt=Date.now();swTimer=setInterval(updateStopwatch,250);btn?.classList.add('active-tool')}updateStopwatch()}
function resetStopwatch(){if(swTimer)clearInterval(swTimer);swTimer=null;swStartedAt=null;swElapsed=0;$('#stopwatchBtn')?.classList.remove('active-tool');updateStopwatch()}
function applyTheme(mode,rerender=false){const dark=mode==='dark';document.body.classList.toggle('dark-mode',dark);localStorage.setItem('tpTheme',dark?'dark':'light');const b=$('#themeBtn');if(b)b.textContent=dark?'☀ Light':'☾ Dark';if(rerender&&state.data)render()}
function toggleTheme(){applyTheme(document.body.classList.contains('dark-mode')?'light':'dark',true)}
let lastPanelFullscreen=null;
function resizeAllChartsToContainers(){requestAnimationFrame(()=>requestAnimationFrame(()=>{state.charts.forEach(c=>{const wrap=c.canvas?.closest('.chart-wrap');if(!wrap)return;const w=Math.max(1,Math.floor(wrap.clientWidth)),h=Math.max(1,Math.floor(wrap.clientHeight));c.resize(w,h)})}))}
async function togglePanelFullscreen(btn){const panel=btn?.closest('.panel');if(!panel)return;try{if(document.fullscreenElement===panel){await document.exitFullscreen();return}if(document.fullscreenElement)await document.exitFullscreen();lastPanelFullscreen=panel;if(panel.requestFullscreen)await panel.requestFullscreen();else if(panel.webkitRequestFullscreen)panel.webkitRequestFullscreen();resizeAllChartsToContainers()}catch(e){console.warn('Panel fullscreen unavailable',e)}}
async function toggleFullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){console.warn('Fullscreen unavailable',e)}}
function syncFullscreenButton(){const b=$('#fullscreenBtn');if(!b)return;b.textContent=document.fullscreenElement?'↙ Exit':'⛶ Full';b.title=document.fullscreenElement?'Exit full screen':'Enter full screen'}
function handleFullscreenChange(){syncFullscreenButton();const active=document.fullscreenElement;$$('.panel-expand-btn').forEach(b=>{const on=active===b.closest('.panel');b.textContent=on?'↙':'⛶';b.title=on?'Exit full screen':'Open this chart full screen';b.setAttribute('aria-label',b.title)});if(!active&&lastPanelFullscreen){lastPanelFullscreen.style.width='';lastPanelFullscreen.style.height='';lastPanelFullscreen.style.maxWidth='';lastPanelFullscreen.style.maxHeight='';lastPanelFullscreen=null}resizeAllChartsToContainers()}
function initUtilityControls(){applyTheme(localStorage.getItem('tpTheme')==='dark'?'dark':'light',false);const sw=$('#stopwatchBtn'),fs=$('#fullscreenBtn'),th=$('#themeBtn');if(sw&&!sw.dataset.bound){sw.onclick=toggleStopwatch;sw.ondblclick=resetStopwatch;sw.dataset.bound='1'}if(fs&&!fs.dataset.bound){fs.onclick=toggleFullscreen;fs.dataset.bound='1'}if(th&&!th.dataset.bound){th.onclick=toggleTheme;th.dataset.bound='1'}if(!document.documentElement.dataset.fullscreenBound){document.addEventListener('fullscreenchange',handleFullscreenChange);document.addEventListener('webkitfullscreenchange',handleFullscreenChange);document.documentElement.dataset.fullscreenBound='1'}syncFullscreenButton();updateStopwatch()}
function bindUI(){initUtilityControls();$$('.nav button').forEach(b=>b.onclick=()=>{if(!canAccess(b.dataset.tab))return;state.tab=b.dataset.tab;render()});['search','buyerFilter','fromDate','toDate'].forEach(id=>$('#'+id).addEventListener('input',render));$('#resetBtn').onclick=()=>{setFilterDefaults();$('#search').value='';$('#buyerFilter').value='';render()};$('#exportBtn').onclick=exportCurrent;}
function exportCurrent(){let rows=state.tab==='buyers'?filteredBuyers():state.tab==='dyeing'?dyeingBuyerRows():state.tab==='knitting'?currentDateRows('Knitting'):state.tab==='finishing'?currentDateRows('Finishing'):state.tab==='delivery'?currentDateRows('FFS'):filteredBuyers();if(!rows.length)return;const ws=XLSX.utils.json_to_sheet(rows);const csv=XLSX.utils.sheet_to_csv(ws);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`Textile_Planning_${state.tab}_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}

const sb=supabase.createClient(window.APP_CONFIG.SUPABASE_URL,window.APP_CONFIG.SUPABASE_ANON_KEY);
async function loadProfile(user){const {data,error}=await sb.from('profiles').select('id,display_name,role,permissions,active').eq('id',user.id).single();if(error)throw error;if(data.active===false)throw new Error('Your dashboard access is disabled. Please contact an administrator.');state.profile=data;return data}
async function loadData(){const {data,error}=await sb.from('dashboard_data').select('file_name,data,uploaded_at').eq('id',1).maybeSingle();if(error)throw error;if(!data){state.data={sheets:Object.fromEntries([...REQUIRED_SHEETS,...DYEING_SHEETS].map(s=>[s,[]])),departmentFiles:{},fileName:'No workbook uploaded',uploadedAt:null}}else{state.data={...data.data,fileName:data.file_name,uploadedAt:data.uploaded_at};state.data.sheets=state.data.sheets||{};for(const s of [...REQUIRED_SHEETS,...DYEING_SHEETS])state.data.sheets[s]=state.data.sheets[s]||[];state.data.departmentFiles=state.data.departmentFiles||{}}setFilterDefaults();document.getElementById('lastUpdated').textContent=state.data.uploadedAt?'Last updated: '+new Date(state.data.uploadedAt).toLocaleString():'';render()}
async function start(){const {data:{session}}=await sb.auth.getSession();if(!session)return;await enter(session.user)}
async function enter(user){try{const p=await loadProfile(user);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('greeting').textContent='Good morning, '+(p.display_name||user.email);bindUI();await loadData()}catch(e){document.getElementById('loginError').textContent=e.message}}
document.getElementById('loginBtn').onclick=async()=>{document.getElementById('loginError').textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('loginError').textContent=error.message;enter(data.user)};
document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('refreshBtn').onclick=loadData;
async function handleDyeingUpload(){const inp=document.getElementById('dyeingFileInput'),f=inp?.files?.[0],st=document.getElementById('dyeingUploadStatus');if(!f)return st.textContent='Choose the Dyeing Excel file first.';if(f.size>MAX_DYEING_FILE_MB*1024*1024)return st.textContent=`File is larger than the recommended ${MAX_DYEING_FILE_MB} MB limit.`;try{st.textContent='Reading and validating Dyeing workbook...';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const dyeSheets=normalizeDyeingWorkbook(wb);const buyerRows=dyeSheets['Dyeing_Date_Buyer'],dateRows=dyeSheets['Dyeing_Date'];const dateFrom=dateRows.length?dateRows[0].Date:null,dateTo=dateRows.length?dateRows[dateRows.length-1].Date:null;const now=new Date().toISOString();const merged={...(state.data||{}),sheets:{...(state.data?.sheets||{}),...dyeSheets},departmentFiles:{...(state.data?.departmentFiles||{}),dyeing:{fileName:f.name,uploadedAt:now,dateFrom,dateTo,buyerRows:buyerRows.length,dateRows:dateRows.length}},fileName:state.data?.fileName||'Department-wise data',uploadedAt:now};st.textContent=`Validated ${buyerRows.length.toLocaleString()} buyer/date rows and ${dateRows.length.toLocaleString()} date rows. Publishing...`;const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('dashboard_data').upsert({id:1,file_name:merged.fileName||f.name,data:merged,uploaded_by:user.id,uploaded_at:now},{onConflict:'id'});if(error)throw error;st.textContent=`Dyeing published successfully (${dateFrom||'—'} to ${dateTo||'—'}). Future placeholder rows were ignored; other department data was preserved.`;await loadData()}catch(e){st.textContent='Dyeing upload failed: '+e.message}}
start();</script></body></html>
