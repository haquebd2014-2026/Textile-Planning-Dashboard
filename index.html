/* v5 focused UI refinements */
.kpi:after{display:none!important}
.kpi-inline-target{font-size:18px!important;gap:2px!important;line-height:1.05;letter-spacing:-.15px}
.kpi-inline-target .slash{margin:0 1px!important}
.panel{position:relative;min-width:0;max-width:100%}
.chart-wrap{position:relative;width:100%;min-width:0;max-width:100%;overflow:hidden}
.chart-wrap canvas{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important}
.panel-expand-btn{position:absolute;top:9px;right:9px;width:28px;height:28px;border:1px solid #d4dfda;background:rgba(255,255,255,.92);color:#075b45;border-radius:5px;display:grid;place-items:center;padding:0;font-size:16px;line-height:1;font-weight:800;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:transform .15s ease,border-color .15s ease,background .15s ease}

.panel:fullscreen .chart-wrap,.panel:-webkit-full-screen .chart-wrap{height:calc(100vh - 105px);min-height:520px}
.panel:fullscreen .panel-expand-btn,.panel:-webkit-full-screen .panel-expand-btn{position:fixed;top:16px;right:18px;width:34px;height:34px;font-size:19px}

function normalizeETLWorkbook(wb){
  const sn='ETL_Date';
  if(!wb.SheetNames.includes(sn))throw new Error(`Missing sheet: ${sn}`);
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null,raw:true});
  const required=['Date',...ETL_COUNT,...ETL_PERCENT,...ETL_DURATION];
  const cols=rows.length?Object.keys(rows[0]):[];
  const miss=required.filter(c=>!cols.includes(c));
  if(miss.length)throw new Error(`${sn} missing column(s): ${miss.join(', ')}`);
  for(const r of rows){
    r.Date=parseDate(r.Date);
    for(const c of ETL_COUNT){const n=safeNum(r[c]);r[c]=n===null?null:n}
    for(const c of ETL_PERCENT){const n=safeNum(r[c]);r[c]=n===null?null:((Math.abs(n)>1.5&&Math.abs(n)<=100)?n/100:n)}
    for(const c of ETL_DURATION){const sec=durationSeconds(r[c]);r[c]=sec===null?null:sec}
  }
  const usable=rows.filter(r=>r.Date&&[...ETL_COUNT,...ETL_PERCENT,...ETL_DURATION].some(c=>r[c]!==null&&r[c]!==undefined&&r[c]!==''));
  usable.sort((a,b)=>a.Date.localeCompare(b.Date));
  if(!usable.length)throw new Error('ETL_Date has no usable rows.');
  const seen=new Set();
  for(const r of usable){if(seen.has(r.Date))throw new Error(`Duplicate Date found in ETL_Date: ${r.Date}`);seen.add(r.Date)}
  return {[sn]:usable}
}
function etlRows(){return currentDateRows('ETL_Date')}
function etlTableHTML(rows,limit=500){
  if(!rows.length)return '<div class="empty">No ETL records for the current filter.</div>';
  const cols=['Date',...ETL_COUNT,...ETL_PERCENT,...ETL_DURATION],show=rows.slice(0,limit);
  let h='<div class="table-wrap"><table><thead><tr>'+cols.map(c=>`<th>${esc(c).replace(/\\n/g,'<br>')}</th>`).join('')+'</tr></thead><tbody>';
  for(const r of show){
    h+='<tr>'+cols.map(c=>{
      let v=r[c];
      if(ETL_DURATION.includes(c))v=formatDuration(v,true);
      else if(ETL_PERCENT.includes(c))v=pct(safeNum(v));
      else if(ETL_COUNT.includes(c))v=fmt(safeNum(v));
      return `<td${c!=='Date'?' class="num"':''}>${esc(v??'')}</td>`;
    }).join('')+'</tr>';
  }
  return h+'</tbody></table></div>'
}

}

async function enter(user){try{const p=await loadProfile(user);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('greeting').textContent='Good morning, '+(p.display_name||user.email);bindUI();await loadData()}catch(e){document.getElementById('loginError').textContent=e.message}}
document.getElementById('loginBtn').onclick=async()=>{document.getElementById('loginError').textContent='';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return document.getElementById('loginError').textContent=error.message;enter(data.user)};
document.getElementById('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('refreshBtn').onclick=loadData;
async function handleDyeingUpload(){const inp=document.getElementById('dyeingFileInput'),f=inp?.files?.[0],st=document.getElementById('dyeingUploadStatus');if(!f)return st.textContent='Choose the Dyeing Excel file first.';if(f.size>MAX_DYEING_FILE_MB*1024*1024)return st.textContent=`File is larger than the recommended ${MAX_DYEING_FILE_MB} MB limit.`;try{st.textContent='Reading and validating Dyeing workbook...';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const dyeSheets=normalizeDyeingWorkbook(wb);const buyerRows=dyeSheets['Dyeing_Date_Buyer'],dateRows=dyeSheets['Dyeing_Date'];const dateFrom=dateRows.length?dateRows[0].Date:null,dateTo=dateRows.length?dateRows[dateRows.length-1].Date:null;const now=new Date().toISOString();const merged={...(state.data||{}),sheets:{...(state.data?.sheets||{}),...dyeSheets},departmentFiles:{...(state.data?.departmentFiles||{}),dyeing:{fileName:f.name,uploadedAt:now,dateFrom,dateTo,buyerRows:buyerRows.length,dateRows:dateRows.length}},fileName:state.data?.fileName||'Department-wise data',uploadedAt:now};st.textContent=`Validated ${buyerRows.length.toLocaleString()} buyer/date rows and ${dateRows.length.toLocaleString()} date rows. Publishing...`;const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('dashboard_data').upsert({id:1,file_name:merged.fileName||f.name,data:merged,uploaded_by:user.id,uploaded_at:now},{onConflict:'id'});if(error)throw error;st.textContent=`Dyeing published successfully (${dateFrom||'—'} to ${dateTo||'—'}). Future placeholder rows were ignored; other department data was preserved.`;await loadData()}catch(e){st.textContent='Dyeing upload failed: '+e.message}}

async function handleKnittingUpload(){const inp=document.getElementById('knittingFileInput'),f=inp?.files?.[0],st=document.getElementById('knittingUploadStatus');if(!f)return st.textContent='Choose the Knitting Excel file first.';if(f.size>MAX_KNITTING_FILE_MB*1024*1024)return st.textContent=`File is larger than the recommended ${MAX_KNITTING_FILE_MB} MB limit.`;try{st.textContent='Reading and validating Knitting workbook...';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const knitSheets=normalizeKnittingWorkbook(wb),dateRows=knitSheets['Knitting_Date'],buyerRows=knitSheets['Knitting_Date_Buyer'];const dateFrom=dateRows.length?dateRows[0].Date:null,dateTo=dateRows.length?dateRows[dateRows.length-1].Date:null,even=knittingBuyerSourceEvenlyAllocated(buyerRows),now=new Date().toISOString();const merged={...(state.data||{}),sheets:{...(state.data?.sheets||{}),...knitSheets},departmentFiles:{...(state.data?.departmentFiles||{}),knitting:{fileName:f.name,uploadedAt:now,dateFrom,dateTo,dateRows:dateRows.length,buyerRows:buyerRows.length,buyerEvenAllocation:even}},fileName:state.data?.fileName||'Department-wise data',uploadedAt:now};st.textContent=`Validated ${dateRows.length.toLocaleString()} date rows and ${buyerRows.length.toLocaleString()} buyer/date rows. Publishing...`;const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('dashboard_data').upsert({id:1,file_name:merged.fileName||f.name,data:merged,uploaded_by:user.id,uploaded_at:now},{onConflict:'id'});if(error)throw error;st.textContent=`Knitting published successfully (${dateFrom||'—'} to ${dateTo||'—'}). ${even?'Note: equal buyer allocation was detected in the source. ':''}Other department data was preserved.`;await loadData()}catch(e){st.textContent='Knitting upload failed: '+e.message}}

async function handleFinishingUpload(){const inp=document.getElementById('finishingFileInput'),f=inp?.files?.[0],st=document.getElementById('finishingUploadStatus');if(!f)return st.textContent='Choose the Finishing Excel file first.';if(f.size>MAX_FINISHING_FILE_MB*1024*1024)return st.textContent=`File is larger than the recommended ${MAX_FINISHING_FILE_MB} MB limit.`;try{st.textContent='Reading and validating Finishing workbook...';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),finSheets=normalizeFinishingWorkbook(wb),dateRows=finSheets['Finishing_Date'];const dateFrom=dateRows.length?dateRows[0].Date:null,dateTo=dateRows.length?dateRows[dateRows.length-1].Date:null,now=new Date().toISOString();const merged={...(state.data||{}),sheets:{...(state.data?.sheets||{}),...finSheets},departmentFiles:{...(state.data?.departmentFiles||{}),finishing:{fileName:f.name,uploadedAt:now,dateFrom,dateTo,dateRows:dateRows.length}},fileName:state.data?.fileName||'Department-wise data',uploadedAt:now};st.textContent=`Validated ${dateRows.length.toLocaleString()} Finishing date rows. Publishing...`;const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('dashboard_data').upsert({id:1,file_name:merged.fileName||f.name,data:merged,uploaded_by:user.id,uploaded_at:now},{onConflict:'id'});if(error)throw error;st.textContent=`Finishing published successfully (${dateFrom||'—'} to ${dateTo||'—'}). Other department data was preserved.`;await loadData()}catch(e){st.textContent='Finishing upload failed: '+e.message}}

async function handleDeliveryUpload(){const inp=document.getElementById('deliveryFileInput'),f=inp?.files?.[0],st=document.getElementById('deliveryUploadStatus');if(!f)return st.textContent='Choose the Delivery Excel file first.';if(f.size>MAX_DELIVERY_FILE_MB*1024*1024)return st.textContent=`File is larger than the recommended ${MAX_DELIVERY_FILE_MB} MB limit.`;try{st.textContent='Reading and validating Delivery workbook...';const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),delSheets=normalizeDeliveryWorkbook(wb),dateRows=delSheets['Delivery_Date'],buyerRows=delSheets['Delivery_Date_Buyer'];const dateFrom=dateRows.length?dateRows[0].Date:null,dateTo=dateRows.length?dateRows[dateRows.length-1].Date:null,even=deliveryBuyerSourceEvenlyAllocated(buyerRows),now=new Date().toISOString();const merged={...(state.data||{}),sheets:{...(state.data?.sheets||{}),...delSheets},departmentFiles:{...(state.data?.departmentFiles||{}),delivery:{fileName:f.name,uploadedAt:now,dateFrom,dateTo,dateRows:dateRows.length,buyerRows:buyerRows.length,buyerEvenAllocation:even}},fileName:state.data?.fileName||'Department-wise data',uploadedAt:now};st.textContent=`Validated ${dateRows.length.toLocaleString()} date rows and ${buyerRows.length.toLocaleString()} buyer/date rows. Publishing...`;const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('dashboard_data').upsert({id:1,file_name:merged.fileName||f.name,data:merged,uploaded_by:user.id,uploaded_at:now},{onConflict:'id'});if(error)throw error;st.textContent=`Delivery published successfully (${dateFrom||'—'} to ${dateTo||'—'}). ${even?'Draft/equal buyer allocation detected; you can replace it later with actual buyer data. ':''}Other department data was preserved.`;await loadData()}catch(e){st.textContent='Delivery upload failed: '+e.message}}

start();</script></body></html>
